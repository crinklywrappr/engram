name: Release to GHCR

# Manual release only. The version is 1.0.<commit-count>, derived by build.clj and
# read back from the uberjar name, so this workflow never restates the formula.
on:
  workflow_dispatch:

permissions:
  contents: write   # push the annotated release tag
  packages: write   # push the image to GHCR

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out at full depth
        uses: actions/checkout@v4
        with:
          # The version counts every commit, so a shallow clone gives the wrong number.
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Run the tests (gate)
        run: clojure -T:build test

      - name: Build the uberjar
        run: clojure -T:build uber

      - name: Derive the version and guard the tag
        id: ver
        run: |
          jar=$(ls target/engram-*-standalone.jar)
          version=$(basename "$jar" | sed -E 's/^engram-(.*)-standalone\.jar$/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"
          if git rev-parse "v$version" >/dev/null 2>&1 \
             || git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "Tag v$version already exists. Refusing to overwrite it." >&2
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the amd64 image for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: engram:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the amd64 image
        run: |
          cid=$(docker run -d --rm \
            -v "$PWD/deploy/engram-config.example.edn:/config/engram-config.edn:ro" \
            engram:smoke)
          ok=""
          for i in $(seq 1 40); do
            code=$(docker exec "$cid" curl -s -m 2 -o /dev/null -w '%{http_code}' \
              http://localhost:8080/healthz || true)
            if [ "$code" = "200" ]; then echo "healthz answered 200 on attempt $i"; ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "Smoke test failed. The server never answered 200 on /healthz." >&2
            docker logs "$cid" || true
            docker stop "$cid" || true
            exit 1
          fi
          docker stop "$cid" || true

      - name: Build and push the multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/crinklywrappr/engram:${{ steps.ver.outputs.version }}
            ghcr.io/crinklywrappr/engram:latest
          labels: |
            org.opencontainers.image.source=https://github.com/crinklywrappr/engram
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag the release commit
        run: |
          version="${{ steps.ver.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$version" -m "Release $version"
          git push origin "v$version"
